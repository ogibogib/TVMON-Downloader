plugins { id 'com.android.application' }

android {
    namespace 'com.tvmon.android'
    compileSdk 36
    defaultConfig {
        applicationId 'com.tvmon.android'
        minSdk 29
        targetSdk 36
        versionCode 11
        versionName '0.1.10'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
        testInstrumentationRunner 'com.tvmon.android.AndroidChecks'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    ndkVersion '27.0.12077973'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main { assets.srcDir "$rootDir/build/native-deps/notices" } }
}
